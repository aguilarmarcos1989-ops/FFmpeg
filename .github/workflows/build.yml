name: Compilar FFmpeg AAC (Lynne - aac_ne3)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Configurar entorno MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            nasm
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-yasm
            mingw-w64-ucrt-x86_64-nasm

      - name: Descargar código fuente (rama aac_ne3 desde code.ffmpeg.org)
        shell: msys2 {0}
        run: |
          git clone --depth 1 -b aac_ne3 https://code.ffmpeg.org/Lynne/FFmpeg.git .

      - name: Compilar FFmpeg
        shell: msys2 {0}
        run: |
          ./configure --disable-shared --enable-static --extra-ldflags="-static"
          make -j$(nproc)

      - name: Guardar ejecutable (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-aac-ne3
          path: ffmpeg.exe
