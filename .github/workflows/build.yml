name: Compilar FFmpeg AAC (Lynne - aac_improv2)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Configurar entorno MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-yasm

      - name: Descargar código fuente (rama aac_improv2 desde code.ffmpeg.org)
        shell: msys2 {0}
        run: |
          git clone --depth 1 -b aac_improv2 https://code.ffmpeg.org/Lynne/FFmpeg.git .

      - name: Compilar FFmpeg
        shell: msys2 {0}
        run: |
          ./configure --disable-shared --enable-static --extra-ldflags="-static"
          make -j$(nproc)

      - name: Guardar ejecutable (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-aac-improv2
          path: ffmpeg.exe
